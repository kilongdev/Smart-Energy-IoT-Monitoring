# Atlas + EMQX Cloud. Only the application runs on this machine.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGO_URI: ${MONGO_URI:?Set the Atlas URI in .env first}
      MONGO_DB: ${MONGO_DB:-smart_energy}
      MQTT_URL: ${MQTT_URL:?Set the EMQX Cloud URL in .env}
      MQTT_USERNAME: ${MQTT_USERNAME:?Set the EMQX username in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set the EMQX password in .env}
    ports: ["127.0.0.1:${PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
